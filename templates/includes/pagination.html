{% if page_obj.has_other_pages %}
<nav class="py-3 px-2" aria-label="Phân trang">
    <ul class="pagination flex-wrap justify-content-center mb-0">
        <li class="page-item{% if not page_obj.has_previous %} disabled{% endif %}">
            {% if page_obj.has_previous %}
            <a class="page-link" href="?{% if query_string %}{{ query_string }}&amp;{% endif %}page={{ page_obj.previous_page_number }}" aria-label="Trang trước">Trước</a>
            {% else %}
            <span class="page-link">Trước</span>
            {% endif %}
        </li>
        <li class="page-item active" aria-current="page">
            <span class="page-link">{{ page_obj.number }}/{{ page_obj.paginator.num_pages }}</span>
        </li>
        <li class="page-item{% if not page_obj.has_next %} disabled{% endif %}">
            {% if page_obj.has_next %}
            <a class="page-link" href="?{% if query_string %}{{ query_string }}&amp;{% endif %}page={{ page_obj.next_page_number }}" aria-label="Trang sau">Sau</a>
            {% else %}
            <span class="page-link">Sau</span>
            {% endif %}
        </li>
    </ul>
</nav>
{% endif %}
